name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Acquire pinned CI secret scanner
        run: |
          mkdir -p .tools
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output .tools/gitleaks.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' '.tools/gitleaks.tar.gz' | sha256sum --check --status
          tar -xzf .tools/gitleaks.tar.gz -C .tools gitleaks
          rm .tools/gitleaks.tar.gz
          printf '%s\n' "${PWD}/.tools" >> "${GITHUB_PATH}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
